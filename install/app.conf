#!/bin/bash
# ============================================================
# 配置：镜像构建与应用配置
#   构建配置（CI 读取）   ：镜像名 / 标签 / 架构
#   应用配置（模板读取） ：依赖安装
# ============================================================

# ------------------------------------------------------------
# 1. 构建配置：镜像仓库与标签（推送到 Docker Hub）
#    部署前把 docker-compose.yml 的 image 改成同一值
# ------------------------------------------------------------
IMAGE_REPO=xct258/random-image
IMAGE_TAG=latest

# 构建架构
PLATFORMS=linux/amd64,linux/arm64

# ------------------------------------------------------------
# 2. 系统依赖（apt）：一行一个
#    php-cli     运行随机壁纸接口（PHP 内置服务器）
#    imagemagick 提供 convert，用于提取图片主题色
# ------------------------------------------------------------
APT_PACKAGES=(
  ca-certificates
  curl
  imagemagick
  php-cli
)

# ------------------------------------------------------------
# 3. 常用软件快捷开关（true / false）
# ------------------------------------------------------------
INSTALL_7Z=false

# ------------------------------------------------------------
# 4. Python 依赖（pip 包）：一行一个
# ------------------------------------------------------------
PYTHON_PACKAGES=(
)

# ------------------------------------------------------------
# 5. 自定义安装脚本（构建时执行一次）
#    本项目不需要，业务代码由 Dockerfile 的 COPY app/ 放入镜像
# ------------------------------------------------------------
INSTALL_CUSTOM=false

# ------------------------------------------------------------
# 6. 日志模块（构建时下载，安装到 /opt/startup/log.sh）
#    来源：xct258/common 仓库，固定到提交 SHA
# ------------------------------------------------------------
LOG_LIB_URL=https://raw.githubusercontent.com/xct258/common/3d48863b2ba5c1de4cfacaa77993e35c77d3d675/%E8%84%9A%E6%9C%AC%E5%B7%A5%E5%85%B7/shell/%E6%97%A5%E5%BF%97%E8%AE%B0%E5%BD%95%E5%92%8C%E6%8E%A8%E9%80%81/log.sh
